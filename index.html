    <script>
      // Defensive protection against environments/extensions that reassign window.fetch when it only has a getter
      try {
        const _origFetch = window.fetch;
        let _customFetch = _origFetch;
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get: function() {
            return _customFetch || _origFetch;
          },
          set: function(fn) {
            _customFetch = fn;
          }
        });
      } catch (_) {}
    </script>
